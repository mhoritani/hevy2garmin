# Self-hosting the dashboard: Postgres and the web app. Auto-sync runs inside the
# web app: turn it on with the Auto-sync toggle on the dashboard.
#
#   cd web
#   cp docker-compose.example.yml docker-compose.yml
#   # create .env next to it with POSTGRES_PASSWORD, H2G_PASSWORD,
#   # HEVY2GARMIN_SECRET and CRON_SECRET (see the README, "Self-hosting")
#   docker compose up -d --build
#
# The dashboard answers on http://127.0.0.1:8096. Put a reverse proxy with TLS
# in front of it; the port is bound to localhost so it is not public by itself.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hevy2garmin
      POSTGRES_USER: hevy2garmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hevy2garmin -d hevy2garmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      # Optional path prefix (README: Under a sub-path), baked in at build time.
      args:
        H2G_BASE_PATH: ${H2G_BASE_PATH:-}
    image: hevy2garmin-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      # The app creates its tables on first use; nothing to migrate by hand.
      DATABASE_URL: postgres://hevy2garmin:${POSTGRES_PASSWORD}@db:5432/hevy2garmin
      H2G_PASSWORD: ${H2G_PASSWORD:?set H2G_PASSWORD in .env}
      HEVY2GARMIN_SECRET: ${HEVY2GARMIN_SECRET:?set HEVY2GARMIN_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      # Optional ones from .env.example (INTERVALS_API_KEY, INTERVALS_ATHLETE_ID, ...)
      # go here as well. Leave GITHUB_PAT and GITHUB_REPO unset: with both set,
      # /api/cron/sync hands the run to GitHub Actions instead of syncing here.
      # Auto-sync runs inside this container: the Auto-sync toggle and interval on
      # the dashboard control it. To drive /api/cron/sync from your own scheduler
      # instead, set H2G_SERVER_SYNC_SCHEDULE (e.g. "every 2 hours") to what it
      # runs; that turns the built-in scheduler off (README: Keeping it in sync).

volumes:
  db_data:
